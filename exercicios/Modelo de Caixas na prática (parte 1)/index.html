<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa parte 1</title>
    <style>
        h1{
            background-color: aqua;
            height: 300;
            width: 300;
            padding: 10px;
            border-width: 10px;
            border-style: solid;
            border-color: bisque;
        }
        a{
            background-color: aqua;
            border-width: 5px;
            border-style: solid;
            border-color: bisque;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa box-level </h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de cx inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
