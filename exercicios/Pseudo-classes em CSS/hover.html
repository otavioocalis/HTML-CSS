<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color: aqua;
            background-color: black;
            border: 3px solid;
            height: 30px;
            width: 300px;
        }
        div:hover{
            color: black;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Teste de hover</p>
    <div>
        passe o mouse AQUI!
        <p>Mudou??</p>
    </div>
    <p>Fim do teste</p>
</body>
</html>
