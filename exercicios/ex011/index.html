<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML 5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos</p>
    
    <picture>

        <source media="(max-width: 750px )" srcset="img/foto-p.png" type="image/png">

        <source media="(max-width: 1050 px)" srcset="img/foto-m.png" type="image/png">

        <img src="img/foto-g.png" alt="imagem flexivel">

    </picture>

    <h1>Som de audio</h1>
    
    <p>vamos testar</p>
    <p>teste comum, como abre direto no código</p>
    <audio src="midia/som teste.mp3" controls autoplay loop> </audio>
    <br>
    <p> configuração do código para varios navegadores</p>
    <audio preload="metadata" autoplay controls loop> <!-- esse código é melhor para se usar-->
        <source src="midia/som teste.mp3" type="audio/mpeg">
        <source src="midia/som teste.mp3" type="audio/ogg">
        <!--<source src="midia/som teste.mp3" type="audio/wav">-->
    </audio>
</body>
</html>
