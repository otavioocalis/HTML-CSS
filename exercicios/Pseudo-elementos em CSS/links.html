<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* 
        seletores personalizados
                # = id
                . = class
                : = pseudo-class
                :: = pseudo-element
                > = children
        
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: rgb(245, 6, 6);
            text-decoration: none;
            font-weight: bold;

        }
        a:visited{
            color: blue;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
        }
        a::after{
            content: ' [link]';
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
        <ul>
            <li><a href="https://github.com/otavioocalis" target="_blank">Repositorio GitHub</a></li>
            <li><a href="https://www.youtube.com/@serliv" target="_blank">Canal YouTube</a></li>
            <li><a href="https://www.cursoemvideo.com/" target="_blank">Site do Curso em Video</a></li>
        </ul>
</body>
</html>
